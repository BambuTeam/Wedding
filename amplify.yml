version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E '^(AUREA_|APP_|DYNAMODB_|ROOT_|NEXT_PUBLIC_|S3_)' >> .env.production || true
        - env | grep -E '^(AUREA_|APP_|DYNAMODB_|ROOT_|NEXT_PUBLIC_|S3_)' >> .env || true
        - nvm use 20 || true
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
